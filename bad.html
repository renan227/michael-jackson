    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { color: #FFD700; margin-bottom: 30px; }
        
        /* Estrutura da Tabela de Músicas */
        .tabela-musicas {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            text-align: left;
        }
        .tabela-musicas tr {
            border-bottom: 1px solid #333;
        }
        .tabela-musicas td {
            padding: 15px 10px;
            vertical-align: middle;
        }
        .nome-musica {
            font-size: 16px;
            font-weight: bold;
        }
        
        /* Botões de Streaming redondos com Ícones */
        .botoes-coluna {
            text-align: right;
            white-space: nowrap;
        }
        .btn-mini {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            margin-left: 8px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 18px; /* Tamanho do ícone */
            color: white;
            transition: 0.2s;
        }
        .btn-spotify { background-color: #1DB954; }
        .btn-spotify:hover { background-color: #1ed760; transform: scale(1.1); }
        .btn-youtube { background-color: #FF0000; }
        .btn-youtube:hover { background-color: #ff3333; transform: scale(1.1); }
        
        .btn-voltar { 
            display: inline-block;
            background-color: #333; 
            color: #FFD700; 
            padding: 12px 24px;
            margin-top: 40px; 
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-voltar:hover { background-color: #444; }
    </style>
</head>
