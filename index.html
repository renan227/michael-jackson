<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Michael Jackson FanPage</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

    <nav class="navbar">
        <div class="logo-nav">MJ FanPage</div>
        <div class="links-nav">
            <a href="#">Início</a>
            <a href="https://www.youtube.com/results?search_query=michael+jackson+albuns" target="_blank">Álbuns</a>
            <a href="https://pt.wikipedia.org/wiki/Michael_Jackson" target="_blank">História</a>
        </div>
    </nav>

    <div class="conteudo-principal">
        <h1>MJ FanPage: O Legado do Rei do Pop</h1>
        <p>Um tributo criado por <strong>Renan</strong> para celebrar a genialidade de Michael Jackson.</p>
        
        <p>Inclusive, comprei um CD da turnê "This Is It".</p>
        <button id="btn-foto">Mostrar meu CD de "This Is It"</button>
        <br><br>
        <img id="foto-cd" src="image.png" alt="This Is It" style="max-width: 300px; display: none;">

        <h2>Destaques da Carreira</h2>
        <div class="container-albuns">
            <div>
                <a href="bad.html"><img src="https://upload.wikimedia.org/wikipedia/en/5/51/Michael_Jackson_-_Bad.png" alt="Bad" width="150"></a>
                <p>Álbum Bad (1987)</p>
            </div>
            <div>
                <a href="thriller.html"><img src="https://upload.wikimedia.org/wikipedia/en/5/55/Michael_Jackson_-_Thriller.png" alt="Thriller" width="150"></a>
                <p>Álbum Thriller (1982)</p>
            </div>
        </div>
    </div>

    <script>
        const botao = document.getElementById('btn-foto');
        const fotoCd = document.getElementById('foto-cd');
        botao.addEventListener('click', () => {
            if (fotoCd.style.display === 'none') {
                fotoCd.style.display = 'block';
                botao.innerText = 'Esconder meu CD';
            } else {
                fotoCd.style.display = 'none';
                botao.innerText = 'Mostrar meu CD de "This Is It"';
            }
        });
    </script>
</body>
</html>
