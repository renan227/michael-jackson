<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Jackson FanPage</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo-nav">MJ FanPage</div>
        <div class="links-nav">
            <a href="#">Início</a>
            <a href="https://www.youtube.com/results?search_query=michael+jackson+albuns" target="_blank">Álbuns</a>
            <a href="https://pt.wikipedia.org/wiki/Michael_Jackson" target="_blank">História</a>
        </div>
    </nav>

    <div class="conteudo-principal">
        <div class="hero-introducao">
            <h1>MJ FanPage: O Legado do Rei do Pop</h1>
            <p>Um tributo criado por <strong>Renan</strong> para celebrar a genialidade de Michael Jackson.</p>
        </div>

        <p>Inclusive, comprei um CD da turnê "This Is It".</p>
        
        <button id="btn-foto">Mostrar meu CD de "This Is It"</button>
        
        <img id="foto-cd" class="escondida" src="image.png" alt="This Is It" style="max-height: 400px; margin-top: 20px;">

        <h1 class="titulo-secao">Destaques da Carreira</h1>

        <div class="container-albuns">
            <div class="card-album-individual">
                <a href="bad.html"><img src="https://upload.wikimedia.org/wikipedia/en/5/51/Michael_Jackson_-_Bad.png" alt="Bad"></a>
                <span>Álbum Bad (1987)</span>
            </div>
            <div class="card-album-individual">
                <a href="thriller.html"><img src="https://upload.wikimedia.org/wikipedia/en/5/55/Michael_Jackson_-_Thriller.png" alt="Thriller"></a>
                <span>Álbum Thriller (1982)</span>
            </div>
        </div>
    </div>

    <script>
        const botao = document.getElementById('btn-foto');
        const fotoCd = document.getElementById('foto-cd');
        
        botao.addEventListener('click', function() {
            if (fotoCd.classList.contains('escondida')) {
                fotoCd.classList.remove('escondida');
                botao.innerText = 'Esconder meu CD';
            } else {
                fotoCd.classList.add('escondida');
                botao.innerText = 'Mostrar meu CD de "This Is It"';
            }
        });
    </script>
</body>
</html>
