<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnê This Is It</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f9;
      color: #333;
    }

    /* Estilo do bloco de texto que será escondido */
    .conteudo-cd {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 20px;
      transition: opacity 0.3s ease;
    }

    /* Estilo do botão verde */
    .btn-esconder-cd {
      background-color: #28a745; /* Verde */
      color: #ffffff; /* Texto branco */
      border: none;
      border-radius: 5px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    /* Efeito de hover (passar o mouse) */
    .btn-esconder-cd:hover {
      background-color: #218838;
    }

    /* Efeito de clique */
    .btn-esconder-cd:active {
      transform: scale(0.98);
    }
  </style>
</head>

  </button>
